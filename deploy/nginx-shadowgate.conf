# ShadowGate vhost — nginx in front of the Node process on 127.0.0.1:4315.
# certbot --nginx adds the 443 server block and the HTTP→HTTPS redirect.
# Behind Cloudflare, also install deploy/nginx-cloudflare-realip.conf.
server {
    listen 80;
    listen [::]:80;
    server_name ai.shadowvpn.live;

    # ACME challenges for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:4315;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # single trusted hop: ShadowGate runs with TRUST_PROXY=1 and reads the
        # last X-Forwarded-For entry, which is $remote_addr (real-ip restored)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE-friendly
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 4m;
    }
}
