services:
  shadowgate:
    build: .
    container_name: shadowgate
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:4315:4315"
    volumes:
      # A named volume is initialised with the image's ownership (user "shadowgate"),
      # so the encrypted store is writable out of the box. To keep the data in a
      # host folder instead, use "./data:/app/data" and make that folder writable
      # by the container user first:  mkdir -p data && sudo chown -R 10001:10001 data
      - shadowgate_data:/app/data
    read_only: false
    security_opt:
      - no-new-privileges:true

  # Optional TLS terminator — put your domain in the Caddyfile
  caddy:
    image: caddy:2-alpine
    container_name: shadowgate-caddy
    restart: unless-stopped
    profiles: ["tls"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - shadowgate

volumes:
  shadowgate_data:
  caddy_data:
  caddy_config:
