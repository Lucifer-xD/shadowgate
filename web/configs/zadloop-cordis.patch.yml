# ShadowGate for ZadLoop / DeepSeek Harness — three picker sections, one key.
# Paste into your profile cordis.patch.yml (or merge the providers into your existing llm-pi-ai entry).
# Key: Settings → Providers → (any ShadowGate section) → Replace key, or set the SHADOWGATE_API_KEY environment variable.
# Effort menu: Low = Light (min), Medium = standard, High = extended, Extra High = xhigh, Max = max (Heavy).
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      shadowgate-unlimited:
        displayName: Unlimited
        api: openai-completions
        baseURL: https://ai.shadowvpn.live/v1
        defaultContextWindow: 262144
        defaultMaxTokens: 16384
        defaultInput:
          - text
          - image
        models:
          - id: gpt-6
            name: GPT-6
            contextWindow: 262144
            maxTokens: 16384
            input:
              - text
              - image
            reasoningEfforts:
              medium: standard
              high: extended
          - id: gpt-6-astra-wm
            name: GPT-6 Astra
            contextWindow: 262144
            maxTokens: 16384
            input:
              - text
              - image
            reasoningEfforts:
              low: min
              medium: standard
              high: extended
          - id: gpt-6.1-sol-wm
            name: GPT-6.1 Sol
            contextWindow: 262144
            maxTokens: 16384
            input:
              - text
              - image
            reasoningEfforts:
              low: min
              medium: standard
              high: extended
          - id: gpt-6-sol-wm
            name: GPT-6 Sol
            contextWindow: 262144
            maxTokens: 16384
            input:
              - text
              - image
            reasoningEfforts:
              medium: standard
              high: extended
          - id: gpt-6-luna-wm
            name: GPT-6 Luna
            contextWindow: 262144
            maxTokens: 16384
            input:
              - text
              - image
            reasoningEfforts:
              low: min
              medium: standard
              high: extended
          - id: gpt-5.6-terra-wm
            name: GPT-5.6 Terra
            contextWindow: 262144
            maxTokens: 16384
            input:
              - text
              - image
            reasoningEfforts:
              low: min
              medium: standard
              high: extended
          - id: gpt-5.6-sol-wm
            name: GPT-5.6 Sol (work mode)
            contextWindow: 262144
            maxTokens: 16384
            input:
              - text
              - image
            reasoningEfforts:
              low: min
              medium: standard
              high: extended
          - id: gpt-5.6-luna-wm
            name: GPT-5.6 Luna (work mode)
            contextWindow: 262144
            maxTokens: 16384
            input:
              - text
              - image
            reasoningEfforts:
              low: min
              medium: standard
              high: extended
          - id: gpt-5-6-mini
            name: GPT-5.6 Luna Mini
            contextWindow: 137000
            maxTokens: 16384
            input:
              - text
              - image
            reasoningEfforts: false
          - id: gpt-5-6-t-mini
            name: GPT-5.6 Luna Thinking Mini
            contextWindow: 262144
            maxTokens: 16384
            input:
              - text
              - image
            reasoningEfforts: false
          - id: gpt-5-3-mini
            name: GPT-5.3 Mini
            contextWindow: 128000
            maxTokens: 16384
            input:
              - text
              - image
            reasoningEfforts: false
        apiKeyEnv: SHADOWGATE_API_KEY
      shadowgate-chat:
        displayName: Normal Chat · saved in ChatGPT
        api: openai-completions
        baseURL: https://ai.shadowvpn.live/v1
        defaultContextWindow: 262144
        defaultMaxTokens: 16384
